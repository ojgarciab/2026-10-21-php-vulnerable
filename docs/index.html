<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analizador php.ini · PHP2Shell</title>
  <link rel="alternate" hreflang="es" href="es/">
  <link rel="alternate" hreflang="en" href="en/">
  <link rel="alternate" hreflang="fr" href="fr/">

  <link rel="alternate" hreflang="de" href="de/">
  <link rel="alternate" hreflang="pt" href="pt/">
  <link rel="alternate" hreflang="x-default" href="es/">
  <script>
    (function () {
      var supported = ['es', 'en', 'fr', 'it', 'de', 'pt'];
      var lang = null;
      try { lang = localStorage.getItem('php2shell-lang'); } catch (e) { /* sin almacenamiento */ }
      if (supported.indexOf(lang) < 0) {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
        lang = nav.slice(0, 2).toLowerCase();
        if (supported.indexOf(lang) < 0) lang = 'es';
      }
      location.replace(lang + '/');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=es/"></noscript>
</head>
